services:
  nuxt-app:
    build:
      context: ../nuxt-app

    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NUXT_KRATOS_INTERNAL_URL: http://kratos:4433
      NUXT_PUBLIC_APP_URL: http://localhost:${NUXT_PORT:-3000}
      NUXT_PUBLIC_KRATOS_BROWSER_URL: http://localhost:${KRATOS_PUBLIC_PORT:-4433}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_BUCKET: ${MINIO_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${NUXT_PORT:-3000}:3000"

    volumes:
      - ../nuxt-app:/app
      - nuxt_node_modules:/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy
      kratos:
        condition: service_started
      minio:
        condition: service_started

    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    command:
      - migrate
      - sql
      - --yes
      - ${KRATOS_DSN}
    environment:
      KRATOS_DSN: ${KRATOS_DSN}
    depends_on:
      postgres:
        condition: service_healthy

  kratos:
    image: oryd/kratos:v1.3.1
    command:
      - serve
      - --config
      - /etc/config/kratos/kratos.yml
    environment:
      DSN: ${KRATOS_DSN}
    ports:
      - "${KRATOS_PUBLIC_PORT:-4433}:4433"
      - "${KRATOS_ADMIN_PORT:-4434}:4434"
    volumes:
      - ./kratos:/etc/config/kratos
    depends_on:
      postgres:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  minio:
    image: cvs-system-minio:RELEASE.2025-10-15T17-29-55Z

    build:
      context: ./minio

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
      - "${MINIO_API_PORT:-9002}:9000"

    volumes:
      - minio_data:/data

    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  nuxt_node_modules:
