version: v1.1.0

dsn: memory

serve:
  public:
    base_url: http://localhost:4433
    cors:
      enabled: true
  admin:
    base_url: http://kratos:4434

selfservice:
  default_browser_return_url: http://localhost:3000
  methods:
    password:
      enabled: true
  flows:
    login:
      ui_url: http://localhost:3000/auth/login
    registration:
      ui_url: http://localhost:3000/auth/register
    recovery:
      enabled: true
      ui_url: http://localhost:3000/auth/recover-password
    verification:
      enabled: true
      ui_url: http://localhost:3000/auth/verify-email

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://localhost:1025/?skip_ssl_verify=true
