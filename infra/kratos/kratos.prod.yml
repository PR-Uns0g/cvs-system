version: v1.1.0

serve:
  public:
    base_url: https://auth.cvssystem.io
  admin:
    base_url: http://kratos:4434

cookies:
  domain: cvssystem.io

selfservice:
  default_browser_return_url: https://cvssystem.io
  methods:
    password:
      enabled: true
  flows:
    error:
      ui_url: https://cvssystem.io/auth/error
    logout:
      after:
        default_browser_return_url: https://cvssystem.io/auth/login
    login:
      ui_url: https://cvssystem.io/auth/login
    registration:
      ui_url: https://cvssystem.io/auth/register
    recovery:
      enabled: true
      ui_url: https://cvssystem.io/auth/recover-password
    verification:
      enabled: true
      ui_url: https://cvssystem.io/auth/verify-email

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://localhost:1025/?skip_ssl_verify=true
